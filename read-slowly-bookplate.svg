<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <filter id="paper" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.76" numOctaves="3" seed="41" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="gray"/>
      <feComponentTransfer in="gray" result="faint">
        <feFuncA type="table" tableValues="0 0.034"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="faint" mode="multiply"/>
    </filter>
    <filter id="ink" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.016 0.085" numOctaves="2" seed="23" result="warp"/>
      <feDisplacementMap in="SourceGraphic" in2="warp" scale="2.1" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="#F4EFE5" filter="url(#paper)"/>

  <g filter="url(#ink)" stroke="#214F9B" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Soft rectangular bookplate, slightly uneven and not mechanically closed. -->
    <path d="M354 300 C425 287 595 289 672 303 C686 372 687 610 674 690 C593 706 426 705 349 690 C338 606 340 379 354 300" stroke-width="12"/>
    <path d="M356 302 C423 292 523 291 585 296" stroke-width="3.5" opacity="0.52"/>
    <path d="M675 476 C680 553 678 624 672 686" stroke-width="3" opacity="0.46"/>

    <!-- Open book: two unequal page blocks and a central spine. -->
    <path d="M386 405 C432 385 473 390 510 420 L510 560 C469 536 429 535 386 551 Z" stroke-width="13" fill="#214F9B"/>
    <path d="M510 420 C550 390 594 387 638 406 L638 551 C596 535 552 537 510 560 Z" stroke-width="13" fill="#214F9B"/>
    <path d="M510 421 C502 462 503 518 510 560" stroke-width="8"/>

    <!-- Paper-colored page fields are cut back into the ink masses. -->
    <path d="M402 421 C439 407 469 412 496 429 L496 530 C465 515 435 513 402 523 Z" stroke="#F4EFE5" stroke-width="8" fill="#F4EFE5"/>
    <path d="M524 429 C554 411 586 407 622 421 L622 523 C590 513 559 515 524 531 Z" stroke="#F4EFE5" stroke-width="8" fill="#F4EFE5"/>

    <!-- Sparse hand-cut reading lines, deliberately incomplete. -->
    <path d="M421 443 C445 437 467 441 483 449 M419 468 C443 462 464 466 483 474 M419 495 C442 489 459 493 476 500" stroke-width="6"/>
    <path d="M541 449 C560 440 583 437 604 443 M541 475 C563 465 584 463 606 469 M543 501 C563 492 581 490 599 495" stroke-width="6"/>

    <!-- Narrow text band integrated into the stamp. -->
    <path d="M379 592 C453 586 574 587 646 594" stroke-width="8"/>
    <path d="M386 654 C458 661 570 660 638 653" stroke-width="7"/>
  </g>

  <text x="512" y="641" text-anchor="middle" fill="#214F9B"
        font-family="PingFang SC, Hiragino Sans GB, Heiti SC, sans-serif"
        font-size="58" font-weight="700" letter-spacing="5"
        filter="url(#ink)">慢慢读</text>

  <!-- Small ink skips keep the impression physical without reducing legibility. -->
  <g fill="#F4EFE5" opacity="0.82">
    <ellipse cx="385" cy="363" rx="3" ry="12" transform="rotate(6 385 363)"/>
    <ellipse cx="672" cy="523" rx="2.5" ry="13" transform="rotate(-5 672 523)"/>
    <ellipse cx="452" cy="402" rx="9" ry="2.5" transform="rotate(-8 452 402)"/>
    <ellipse cx="577" cy="548" rx="8" ry="2.5" transform="rotate(7 577 548)"/>
  </g>
</svg>