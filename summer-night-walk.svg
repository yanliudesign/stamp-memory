<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <filter id="paper" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.72" numOctaves="3" seed="17" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="gray"/>
      <feComponentTransfer in="gray" result="faint">
        <feFuncA type="table" tableValues="0 0.035"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="faint" mode="multiply"/>
    </filter>
    <filter id="ink" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018 0.09" numOctaves="2" seed="29" result="warp"/>
      <feDisplacementMap in="SourceGraphic" in2="warp" scale="2.3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <mask id="moon-cut">
      <rect width="1024" height="1024" fill="black"/>
      <circle cx="615" cy="365" r="48" fill="white"/>
      <circle cx="637" cy="347" r="43" fill="black"/>
    </mask>
  </defs>

  <rect width="1024" height="1024" fill="#F4EFE5" filter="url(#paper)"/>

  <g filter="url(#ink)" fill="none" stroke="#24231F" stroke-linecap="round" stroke-linejoin="round">
    <!-- Hand-cut oval, deliberately open and doubled in two places. -->
    <path d="M510 258 C627 253 704 329 724 451 C746 579 694 704 583 755 C472 806 344 750 303 642 C263 536 283 391 366 309 C405 271 458 257 510 258" stroke-width="11"/>
    <path d="M365 309 C406 272 456 260 501 260" stroke-width="3.5" opacity="0.58"/>
    <path d="M585 755 C647 725 688 675 710 613" stroke-width="3" opacity="0.48"/>

    <!-- A single winding path, widening toward the foreground. -->
    <path d="M542 684 C521 638 529 595 552 555 C573 518 575 479 554 448" stroke-width="15"/>
    <path d="M492 691 C472 636 484 579 521 535 C548 504 552 473 538 446" stroke-width="6"/>
    <path d="M492 691 C506 697 526 695 542 684" stroke-width="7"/>

    <!-- Walking figure reduced to a readable carved gesture. -->
    <circle cx="474" cy="457" r="24" fill="#24231F" stroke="none"/>
    <path d="M473 486 C468 523 469 548 483 574" stroke-width="17"/>
    <path d="M475 505 C445 516 430 539 415 560" stroke-width="12"/>
    <path d="M480 509 C506 517 522 531 535 548" stroke-width="10"/>
    <path d="M483 573 C461 600 449 625 437 653" stroke-width="14"/>
    <path d="M485 574 C507 597 520 618 535 644" stroke-width="14"/>
    <path d="M437 653 C427 658 416 659 406 655" stroke-width="8"/>
    <path d="M535 644 C546 649 556 649 566 645" stroke-width="8"/>

    <!-- Sparse summer ground: one grass tuft, not a full landscape. -->
    <path d="M376 654 C373 629 366 610 354 593 M376 654 C383 627 393 609 408 594 M376 654 C374 624 379 601 386 581" stroke-width="7"/>
    <path d="M657 615 C653 596 646 582 637 570 M657 615 C665 594 674 581 685 570" stroke-width="6"/>
  </g>

  <!-- Dense moon mass with an open paper crescent. -->
  <rect width="1024" height="1024" fill="#24231F" mask="url(#moon-cut)" filter="url(#ink)"/>

  <!-- Tiny cobalt night accents, under eight percent of printed marks. -->
  <g fill="#214F9B" filter="url(#ink)">
    <path d="M420 387 L426 400 L440 404 L427 410 L423 424 L417 411 L403 407 L416 401 Z"/>
    <path d="M665 455 L670 466 L682 469 L671 474 L667 486 L662 475 L650 471 L661 466 Z"/>
    <circle cx="391" cy="478" r="6"/>
  </g>

  <!-- Small paper-colored ink skips keep the solids physically printed. -->
  <g fill="#F4EFE5" opacity="0.78">
    <ellipse cx="468" cy="452" rx="5" ry="2.5" transform="rotate(-14 468 452)"/>
    <ellipse cx="488" cy="537" rx="3" ry="9" transform="rotate(-22 488 537)"/>
    <ellipse cx="307" cy="515" rx="2" ry="13" transform="rotate(8 307 515)"/>
    <ellipse cx="710" cy="520" rx="2.5" ry="10" transform="rotate(-9 710 520)"/>
  </g>
</svg>