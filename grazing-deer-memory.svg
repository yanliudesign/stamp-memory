<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <filter id="paper" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.72" numOctaves="3" seed="37" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="gray"/>
      <feComponentTransfer in="gray" result="faint">
        <feFuncA type="table" tableValues="0 0.04"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="faint" mode="multiply"/>
    </filter>
    <filter id="ink" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018 0.074" numOctaves="2" seed="19" result="warp"/>
      <feDisplacementMap in="SourceGraphic" in2="warp" scale="2.4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="#F4EFE5" filter="url(#paper)"/>

  <g fill="#65704A" stroke="#65704A" stroke-linecap="round" stroke-linejoin="round" filter="url(#ink)">
    <!-- Grazing deer reduced to one carved profile silhouette. -->
    <path d="M421 433
             C468 405 550 397 618 418
             C655 430 676 455 672 486
             C668 513 649 530 622 535
             C587 542 539 537 499 527
             C477 522 456 523 439 537
             C419 553 402 576 386 599
             L362 585
             C378 551 391 515 394 481
             C396 462 404 444 421 433 Z"/>

    <!-- Lowered neck and head preserve the source photograph's gesture. -->
    <path d="M438 454
             C417 476 401 510 390 548
             C381 580 369 612 348 638
             C337 651 323 658 308 654
             C293 650 284 638 288 626
             C292 613 306 603 322 601
             C338 581 347 551 354 518
             C362 479 380 447 409 426 Z"/>
    <path d="M289 625 C275 622 266 614 268 606 C278 602 289 604 300 610 Z"/>
    <path d="M306 612 C299 594 300 581 309 570 C320 580 322 596 316 610 Z"/>

    <!-- Four sturdy legs with uneven, hand-cut hoof endings. -->
    <path d="M440 514 C455 518 466 525 469 537 L451 641 L432 641 L434 548 Z"/>
    <path d="M488 526 C501 529 511 534 516 543 L505 650 L486 650 L487 552 Z"/>
    <path d="M605 531 C620 530 630 526 640 519 L629 638 L610 638 L606 553 Z"/>
    <path d="M648 512 C660 505 667 495 672 482 L674 624 L655 624 L650 545 Z"/>
    <path d="M428 640 L452 640 L449 650 L426 650 Z M482 649 L507 649 L504 659 L480 659 Z
             M606 637 L632 637 L629 647 L605 647 Z M651 623 L677 623 L674 633 L650 633 Z"/>

    <!-- Branched antlers drawn as blunt carved strokes, not realistic detail. -->
    <g fill="none" stroke-width="13">
      <path d="M326 583 C313 551 297 523 278 500 C259 478 249 452 252 426"/>
      <path d="M299 538 C277 529 258 514 245 494"/>
      <path d="M276 499 C270 476 271 454 280 434"/>
      <path d="M316 579 C313 543 311 512 315 483 C318 458 311 436 296 417"/>
      <path d="M313 518 C329 503 338 486 339 466"/>
      <path d="M312 488 C300 470 294 452 296 433"/>
    </g>

    <!-- Tail and two sparse ground cuts carry the hillside memory. -->
    <path d="M665 445 C688 445 700 453 706 468 C690 473 675 469 664 459 Z"/>
    <g fill="none" stroke-width="8">
      <path d="M270 673 C348 662 433 671 505 666"/>
      <path d="M541 668 C588 662 631 665 682 658"/>
    </g>
  </g>

  <!-- Paper cuts open the body and imply coarse fur without shading. -->
  <g fill="#F4EFE5" stroke="#F4EFE5" stroke-linecap="round" filter="url(#ink)">
    <path d="M443 454 C485 433 547 429 605 443 C624 448 638 459 641 474
             C611 466 583 467 553 475 C519 484 483 480 448 470 Z" stroke-width="5"/>
    <g fill="none" stroke-width="7">
      <path d="M462 493 C486 486 507 487 526 493"/>
      <path d="M548 501 C568 494 588 494 607 499"/>
      <path d="M404 502 C414 490 424 483 437 479"/>
      <path d="M338 620 C327 623 319 628 314 636"/>
    </g>
    <ellipse cx="309" cy="628" rx="4" ry="5"/>
    <ellipse cx="572" cy="426" rx="13" ry="3" transform="rotate(5 572 426)"/>
    <ellipse cx="458" cy="534" rx="3" ry="13" transform="rotate(8 458 534)"/>
    <ellipse cx="651" cy="489" rx="3" ry="11" transform="rotate(-7 651 489)"/>
  </g>
</svg>